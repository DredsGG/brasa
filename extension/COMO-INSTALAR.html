<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasa</title>
<style>
/* Guia no visual do TikTok web (medido em 2026-11-11): escuro #121212 / claro #fff, texto #161823, destaque #fe2c55 (#ff3b5c no escuro),
   TikTokFont com Arial de reserva, caixas raio 8, botões em pílula. */
:root { --bg:#121212; --tx:rgba(255,255,255,.9); --tx2:rgba(255,255,255,.75); --add:rgba(255,255,255,.08); --line:rgba(255,255,255,.12); --acc:#ff3b5c; }
:root[data-theme=light] { --bg:#fff; --tx:#161823; --tx2:rgba(22,24,35,.75); --add:rgba(22,24,35,.06); --line:rgba(22,24,35,.12); --acc:#fe2c55; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/24px TikTokFont, Arial, Tahoma, sans-serif; -webkit-font-smoothing: antialiased; }
.top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .in { max-width: 820px; margin: 0 auto; height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 10px; }
.top svg { color: var(--acc); } .top b { font-size: 20px; font-weight: 700; }
nav.langs { margin-left: auto; display: flex; gap: 2px; }
nav.langs button { font: 600 12px Arial, sans-serif; height: 28px; padding: 0 10px; border-radius: 14px; border: 0; background: none; color: var(--tx2); cursor: pointer; }
nav.langs button.on { background: var(--add); color: var(--tx); }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 26px; line-height: 34px; margin: 0 0 4px; font-weight: 700; } .works { color: var(--tx2); margin: 0 0 24px; }
h2 { font-size: 20px; line-height: 28px; margin: 32px 0 12px; font-weight: 700; scroll-margin-top: 76px; }
.box { background: var(--add); border-radius: 8px; padding: 16px 20px; margin: 0 0 12px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.tabs button { font: 600 14px Arial, sans-serif; height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: var(--add); color: var(--tx); cursor: pointer; }
.tabs button.on { background: var(--acc); color: #fff; }
ol { margin: 0; padding-left: 22px; } li { margin: 6px 0; }
code { background: var(--add); padding: 1px 6px; border-radius: 4px; font-size: 14px; }
.note { color: var(--tx2); font-size: 14px; }
footer { max-width: 820px; margin: 0 auto; padding: 16px; color: var(--tx2); font-size: 12px; border-top: 1px solid var(--line); }
footer a { color: var(--tx); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="top"><div class="in"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21.5c3.9 0 6.8-2.6 6.8-6.5 0-3-1.7-5.2-3.5-7-.3 1.8-1.1 2.9-2.3 3.4.4-3.1-.9-6-3.5-8.2-.2 3.2-1.8 5-3.3 6.8C4.9 11.4 5.2 13.2 5.2 15c0 3.9 2.9 6.5 6.8 6.5z"/><path d="M12 21.5c-1.6 0-2.8-1.1-2.8-2.8 0-1.5 1.1-2.5 2.1-3.4.3 1 .8 1.5 1.5 1.7.2-.9.7-1.5 1.3-2 .5 1 .7 1.9.7 2.8 0 2.2-1.2 3.7-2.8 3.7z"/></svg><b>Brasa</b>
  <nav class="langs"><button data-l="pt">PT</button><button data-l="en">EN</button><button data-l="es">ES</button></nav></div></div>
<main id="m"></main>
<footer id="f"></footer>
<script src="src/i18n.js"></script>
<script src="guia.js"></script>
</body>
</html>
